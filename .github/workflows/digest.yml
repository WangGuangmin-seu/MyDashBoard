name: digest

# 09:30 Asia/Shanghai (UTC+8). Reads the snapshot committed by collect.yml at
# 01:00 UTC and posts one card with every series. GitHub's scheduler can add a
# few minutes of latency, so treat "09:30" as "a little after 09:30".
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python & deps
        run: uv sync

      - name: Send daily digest card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # Defaults to the deployed dashboard; override by setting a repository
          # variable (Settings → Secrets and variables → Actions → Variables)
          # named DASHBOARD_SITE_URL if the domain ever changes.
          DASHBOARD_SITE_URL: ${{ vars.DASHBOARD_SITE_URL || 'https://mydashboard.wangguangmin1995.workers.dev/' }}
        run: uv run python -m dashboard digest
